# based on /Applications/AeroSpace.app/Contents/Resources/default-config.toml

config-version = 2
start-at-login = true
default-root-container-layout = 'accordion'
default-root-container-orientation = 'horizontal'
automatically-unhide-macos-hidden-apps = true
persistent-workspaces = ["1", "2"]
#focus-follows-mouse.enabled = true

[mode.main.binding]

### Global bindings

alt-shift-c = 'reload-config'

### workspace bindings

alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'

alt-shift-1 = 'move-node-to-workspace 1'
alt-shift-2 = 'move-node-to-workspace 2'
alt-shift-3 = 'move-node-to-workspace 3'
alt-shift-4 = 'move-node-to-workspace 4'

### Container bindings

# layout
alt-w = 'layout accordion horizontal'
alt-e = 'layout tiles horizontal vertical'

# open/close apps
alt-enter = '''exec-and-forget \
    /Applications/Alacritty.app/Contents/MacOS/alacritty msg create-window || \
    open -a "Alacritty"'''
alt-shift-enter = 'exec-and-forget open -a "Google Chrome"'
alt-shift-q = 'close'

# focus
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

# move
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

# floating
alt-shift-space = 'layout floating tiling'

alt-f = 'fullscreen'
