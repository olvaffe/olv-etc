{
  "Dhcp4": {
    "interfaces-config": {
      "interfaces": [
        "lan",
        "iot"
      ],
      "service-sockets-require-all": true
    },

    "control-socket": {
      "socket-type": "unix",
      "socket-name": "/run/kea/kea4-ctrl-socket"
    },

    "lease-database": {
      "type": "memfile"
    },

    "authoritative": true,
    "valid-lifetime": 86400,
    "calculate-tee-times": true,
    "host-reservation-identifiers": [
      "hw-address"
    ],
    "reservations-out-of-pool": true,

    "option-data": [
      {
        "name": "domain-name-servers",
        "data": "10.87.20.1"
      }
    ],

    "subnet4": [
      {
        "id": 20,
        "subnet": "10.87.20.0/24",
        "interface": "lan",
        "pools": [
          {
            "pool": "10.87.20.20 - 10.87.20.99"
          }
        ],
        "option-data": [
          {
            "name": "routers",
            "data": "10.87.20.1"
          },
          {
            "name": "domain-name",
            "data": "internal"
          }
        ],
        "reservations": <?include "/etc/kea/subnet-lan-reservations.json"?>
      },
      {
        "id": 30,
        "subnet": "10.87.30.0/24",
        "interface": "iot",
        "pools": [
          {
            "pool": "10.87.30.20 - 10.87.30.99"
          }
        ],
        "option-data": [
          {
            "name": "routers",
            "data": "10.87.30.1"
          }
        ],
        "reservations": <?include "/etc/kea/subnet-iot-reservations.json"?>
      }
    ],

    "loggers": [
      {
        "name": "kea-dhcp4",
        "output-options": [
          {
            "output": "syslog",
            "pattern": "%m\n"
          }
        ],
        "severity": "WARN"
      }
    ]
  }
}
