define lan = "lan"
define wan = "wan"
define iot = "iot"
define vpn = "wg0"
define server = 10.87.20.10

flush ruleset

table inet filter {
	chain input {
		type filter hook input priority filter; policy drop;

		ct state established,related accept
		ct state invalid drop

		iifname $lan accept
		iifname $vpn accept
		iif "lo" accept

		iifname $iot udp dport 53 accept
		iifname $iot tcp dport 53 accept
		iifname $iot udp dport 5353 accept
		iifname $iot meta nfproto ipv4 udp dport 67 accept
		iifname $iot icmpv6 type nd-router-solicit accept

		iifname $wan meta nfproto ipv6 udp dport 546 accept
		iifname $wan icmpv6 type nd-router-advert accept

		udp dport 51820 accept

		icmp type echo-request accept
		icmpv6 type { echo-request, nd-neighbor-solicit, nd-neighbor-advert } accept
	}

	chain forward {
		type filter hook forward priority filter; policy drop;

		ct state established,related accept
		ct state invalid drop

		iifname $lan accept
		iifname $vpn accept
		iifname $iot oifname $wan accept

		ct status dnat accept
	}
}

table ip nat {
	chain prerouting {
		type nat hook prerouting priority dstnat; policy accept;

		iifname $wan tcp dport 51820 dnat to $server
	}

	chain postrouting {
		type nat hook postrouting priority srcnat; policy accept;

		oifname $wan masquerade
	}
}

table inet stats {
	set forward_ipv4_rx {
		type ipv4_addr
		size 256
		flags dynamic,timeout
		counter
		timeout 1h
	}

	set forward_ipv4_tx {
		type ipv4_addr
		size 256
		flags dynamic,timeout
		counter
		timeout 1h
	}

	set forward_ipv6_rx {
		type ipv6_addr
		size 256
		flags dynamic,timeout
		counter
		timeout 1h
	}

	set forward_ipv6_tx {
		type ipv6_addr
		size 256
		flags dynamic,timeout
		counter
		timeout 1h
	}

	chain forward {
		type filter hook forward priority filter + 1; policy accept;

		iifname $wan update @forward_ipv4_rx { ip daddr }
		oifname $wan update @forward_ipv4_tx { ip saddr }
		iifname $wan update @forward_ipv6_rx { ip6 daddr }
		oifname $wan update @forward_ipv6_tx { ip6 saddr }
	}
}
